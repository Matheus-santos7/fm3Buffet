version: '3.8'

services:
  app:
    container_name: fm3buffet
    image: theussm/fm3buffet:latest
    ports:
      - "3000:3000"
    environment:
      - AMBIENTE=dev
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=123
      - DB_NAME=deliveryOnline
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: fm3buffet_db
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: deliveryOnline
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/backup.sh:/docker-entrypoint-initdb.d/backup.sh
      - ./docker/backups:/backups

volumes:
  db_data:
