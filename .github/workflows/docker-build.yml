name: Auto-increment Version and Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Check out the code
        uses: actions/checkout@v3

      # Configuração do Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # Leitura do arquivo de versão e incremento automático
      - name: Auto-increment version
        id: increment_version
        run: |
          # Ler a versão atual do arquivo VERSION
          VERSION=$(cat VERSION)
          echo "Versão atual: $VERSION"

          # Separar a versão em major.minor.patch
          IFS='.' read -r major minor patch <<< "$VERSION"

          # Incrementar o valor do patch (ou outra parte da versão)
          patch=$((patch + 1))
          NEW_VERSION="$major.$minor.$patch"
          echo "Nova versão: $NEW_VERSION"

          # Atualizar o arquivo de versão
          echo "$NEW_VERSION" > VERSION

          # Definir a nova versão como uma variável de ambiente
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # Commit da nova versão no repositório
      - name: Commit new version
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add VERSION
          git commit -m "Increment version to ${{ env.VERSION }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Construção e envio da imagem Docker com as tags "latest" e nova versão
      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 -t theussm/fm3buffet:latest -t theussm/fm3buffet:${{ env.VERSION }} .
          docker push theussm/fm3buffet:latest
          docker push theussm/fm3buffet:${{ env.VERSION }}
