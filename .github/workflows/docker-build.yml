name: Build Docker Image

on:
  push:
    branches:
      - main  # ou a branch que você deseja monitorar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3  # Atualizado para v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Atualizado para v3

      - name: Log in to Docker Hub
        run: echo "1101M@theus" | docker login -u "theussm" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build --platform linux/amd64 -t fm3buffet .
          docker tag fm3buffet theussm/fm3buffet:latest
          docker push theussm/fm3buffet:latest
